name: Diagnose Equal Groups
'on':
  push:
    paths:
      - .github/workflows/diagnose-unclejoe.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect equal groups markup
        shell: bash
        run: |
          python -c "from pathlib import Path; s=Path('index.html').read_text(encoding='utf-8'); i=s.find('groups of'); print('INDEX',i); print(s[max(0,i-3500):i+3500])"
