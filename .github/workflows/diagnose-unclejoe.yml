name: Patch Resume And Restart
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch game
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(encoding="utf-8"); s=s.replace(">Hold 2s to Reset<",">Restart Game<").replace("<b>Reset Progress</b>","<b>Restart Game</b>"); old='"'"'      // Opening lesson must never be skipped by saved testing progress.\n      // Start outside, show the button, and require the equal-groups puzzle first.\n      setupOpeningStart(true);\n      showMessage("Opening Scene: solve the equal-groups puzzle at the pyramid button before entering.");'"'"'; new='"'"'      if(progressLoaded){\n        showMessage("Progress restored. Continue from where you left off.");\n      }else{\n        setupOpeningStart(true);\n        showMessage("Opening Scene: solve the equal-groups puzzle at the pyramid button before entering.");\n      }'"'"'; s=s.replace(old,new,1); p.write_text(s,encoding="utf-8")'
      - name: Commit
        shell: bash
        run: |
          git config user.name "limkimsze-maker"
          git config user.email "lim_kim_sze@moe.edu.sg"
          git add index.html
          git commit -m "Resume saved stage and add Restart Game" || exit 0
          git push
