name: Patch Uncle Joe Background Sound
on:
  push:
    paths:
      - '.github/workflows/diagnose-unclejoe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove continuous background ambience only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='const BG_AMBIENCE_VOLUME = 0.18;'
          new='const BG_AMBIENCE_VOLUME = 0.0;'
          if old not in s:
              raise SystemExit("Expected background ambience volume line not found")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit patch
        run: |
          git config user.name "limkimsze-maker"
          git config user.email "lim_kim_sze@moe.edu.sg"
          git add index.html
          git commit -m "Disable continuous background ambience" || exit 0
          git push
