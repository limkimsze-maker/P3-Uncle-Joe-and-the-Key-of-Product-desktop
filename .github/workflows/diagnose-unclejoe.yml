name: Patch Equal Groups Equation
'on':
  push:
    paths:
      - .github/workflows/diagnose-unclejoe.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep equal-groups equation on one row
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); css='\n/* Equal Groups one-line equation */\n#equalGroupOverlay .egEquation{display:flex !important;flex-direction:row !important;flex-wrap:nowrap !important;align-items:center !important;justify-content:flex-start !important;gap:10px !important;white-space:nowrap !important;}\n#equalGroupOverlay .egEquation>*{flex:0 0 auto !important;}\n'; s=s if '/* Equal Groups one-line equation */' in s else s.replace('</style>',css+'</style>',1); p.write_text(s,encoding='utf-8')"
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "limkimsze-maker"
          git config user.email "lim_kim_sze@moe.edu.sg"
          git add index.html
          git commit -m "Keep Equal Groups equation on one line" || exit 0
          git push
