name: Patch Scarab Wording
'on':
  push:
    paths:
      - .github/workflows/diagnose-unclejoe.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update visible scarab wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          replacements = {
            "All 6 scarabs":"All 5 scarabs",
            "6 scarabs":"5 scarabs",
            "six scarabs":"five scarabs",
            "Six scarabs":"Five scarabs"
          }
          changed=False
          for a,b in replacements.items():
              if a in s:
                  s=s.replace(a,b)
                  changed=True
          if not changed:
              print("No literal 6-scarab wording found; leaving file unchanged.")
          p.write_text(s,encoding="utf-8")
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "limkimsze-maker"
          git config user.email "lim_kim_sze@moe.edu.sg"
          git add index.html
          git commit -m "Update scarab wording to five" || exit 0
          git push
