name: Diagnose Uncle Joe HTML
on:
  push:
    paths:
      - '.github/workflows/diagnose-unclejoe.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect quiz and animation code
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          terms=[
            "function renderPlaceValue",
            "function animate",
            "regroup",
            "counter",
            "pvCounter",
            "placeValue",
            "algoModal",
            "feedback",
            "checkAnswer",
            "ones",
            "tens"
          ]
          for t in terms:
              print("\n===== TERM",t,"=====")
              start=0; n=0
              while True:
                  i=s.lower().find(t.lower(),start)
                  if i<0 or n>=20: break
                  print("\n--- occurrence",n+1,"at",i,"---")
                  print(s[max(0,i-1400):min(len(s),i+3200)])
                  start=i+len(t); n+=1
          PY
