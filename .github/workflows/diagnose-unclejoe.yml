name: Diagnose Scarab Creation
'on':
  push:
    paths:
      - .github/workflows/diagnose-unclejoe.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect scarab creation code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          for term in ["function addScarab","addScarab(","scarabs.push","scarabPositions","SCARAB_TOTAL","for(let i=0;i<6","for (let i=0;i<6"]:
              print("\n====",term,"====")
              start=0; n=0
              while True:
                  i=s.find(term,start)
                  if i<0 or n>=12: break
                  print("\n---",i,"---")
                  print(s[max(0,i-1800):min(len(s),i+3500)])
                  start=i+len(term); n+=1
          PY
