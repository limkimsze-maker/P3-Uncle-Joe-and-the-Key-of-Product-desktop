name: Diagnose Start Handler
'on':
  push:
    paths:
      - .github/workflows/diagnose-unclejoe.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect start handler
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          low=s.lower()
          terms=['getelementbyid("coverstartbtn")',"coverstartbtn.onclick","coverstartbtn).addeventlistener","coverstartbtn').addeventlistener","applysavedprogress()","progressloaded ?","if(progressloaded)","outdoor_start","first_chamber_entry"]
          for term in terms:
              print("\n====",term,"====")
              start=0; n=0
              while True:
                  i=low.find(term.lower(),start)
                  if i<0 or n>=20: break
                  print("\n---",i,"---")
                  print(s[max(0,i-2800):min(len(s),i+6500)])
                  start=i+len(term); n+=1
          PY
