name: Diagnose Equal Groups CSS
'on':
  push:
    paths:
      - .github/workflows/diagnose-unclejoe.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect egEquation CSS
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          term=".egEquation"
          start=0
          n=0
          while True:
              i=s.find(term,start)
              if i<0 or n>=20: break
              print("\n--- OCC",n+1,"AT",i,"---")
              print(s[max(0,i-1800):min(len(s),i+2800)])
              start=i+len(term)
              n+=1
          PY
