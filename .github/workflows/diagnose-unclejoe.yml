name: Diagnose Stage Positions
'on':
  push:
    paths:
      - .github/workflows/diagnose-unclejoe.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect stage jump positions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          low=s.lower()
          terms=["data-debug-jump","debugjump","jumptostage","completeprevious","unlockprevious","camera.position.set(0,1.65","camera.position.set(0, 1.65"]
          for term in terms:
              print("\n====",term,"====")
              start=0; n=0
              while True:
                  i=low.find(term,start)
                  if i<0 or n>=20: break
                  print("\n---",i,"---")
                  print(s[max(0,i-3000):min(len(s),i+6000)])
                  start=i+len(term); n+=1
          PY
