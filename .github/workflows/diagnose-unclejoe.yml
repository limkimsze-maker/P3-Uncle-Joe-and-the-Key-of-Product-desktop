name: Diagnose Resume Hook
'on':
  push:
    paths:
      - .github/workflows/diagnose-unclejoe.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect resume hook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          low=s.lower()
          terms=["progressloaded","data.camera","saved.camera","loadprogressdata()","applyprogressvisuals()","coverstartbtn.addeventlistener","start / continue","camera.position.set(","cameraposition"]
          for term in terms:
              print("\n====",term,"====")
              start=0; n=0
              while True:
                  i=low.find(term,start)
                  if i<0 or n>=14: break
                  print("\n---",i,"---")
                  print(s[max(0,i-2200):min(len(s),i+4600)])
                  start=i+len(term); n+=1
          PY
