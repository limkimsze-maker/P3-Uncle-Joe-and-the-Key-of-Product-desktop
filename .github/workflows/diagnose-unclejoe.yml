name: Verify Progression Items
'on':
  push:
    paths:
      - .github/workflows/diagnose-unclejoe.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect progression names from programme
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path("index.html").read_text(encoding="utf-8")
          terms=["ruby","topaz","emerald","sapphire","wand","restorationKey","key of product","jewel","gem"]
          low=s.lower()
          for term in terms:
              print("\n====",term,"====")
              start=0; n=0
              while True:
                  i=low.find(term.lower(),start)
                  if i<0 or n>=20: break
                  print("\n---",i,"---")
                  print(s[max(0,i-450):min(len(s),i+950)])
                  start=i+len(term)
                  n+=1
          PY
